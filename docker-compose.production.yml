version: '3'

volumes:
  pg_data_production:
  static_volume:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: lvnmary/foodgram_backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
      - media:/app/media

  frontend:
    image: lvnmary/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /static/
    volumes:
      - static_volume:/static

  gateway:
    depends_on:
      - backend
      - frontend
    image: lvnmary/foodgram_gateway
    env_file: .env
    ports:
      - 8090:80
    volumes:
      - static_volume:/static/
      - media:/media/
